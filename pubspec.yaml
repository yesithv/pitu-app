name: pitu_app
description: "PetBienestar — gestión del cuidado y la salud de mascotas (local-first)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^4.0.0
  local_auth: ^2.3.0
  in_app_purchase: ^3.2.0
  uuid: ^4.5.1
  crypto: ^3.0.3
  intl: ^0.20.2
  collection: ^1.18.0
  pdf: ^3.11.1
  share_plus: ^10.0.0
  file_picker: ^8.1.2
  image: ^4.2.0
  # Persistencia móvil: SQLite cifrado (Drift + SQLCipher) con clave en el
  # llavero del SO (RNF-10). En web no se usan (se aísla por conditional import).
  drift: ^2.20.0
  sqlite3: ^2.4.0
  sqlcipher_flutter_libs: ^0.6.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Generación de código de Drift (`*.g.dart`). Corre en CI antes de analyze/test.
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  # Fuentes Nunito (OFL) embebidas en el PDF del reporte veterinario para que
  # los signos tipográficos (guion largo, etc.) se rendericen y la exportación
  # sea coherente con la marca. Se leen como bytes con rootBundle (no se
  # registran como `fonts:` porque solo las usa el paquete `pdf`).
  assets:
    - assets/fonts/Nunito-Regular.ttf
    - assets/fonts/Nunito-Bold.ttf
  # Genera la clase de localizaciones (AppLocalizations) a partir de los ARB en
  # lib/l10n al hacer `flutter pub get` (config en l10n.yaml). Autodetección de
  # idioma con inglés por defecto (es, en, fr, pt, de).
  generate: true
