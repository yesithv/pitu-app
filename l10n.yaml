# Configuración de gen-l10n (Flutter). El inglés es el idioma plantilla y el
# valor por defecto cuando el idioma del dispositivo no está soportado.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
# Sin paquete sintético (retirado en Flutter reciente): se genera en lib/l10n/ y
# se importa como package:pitu_app/l10n/app_localizations.dart (comportamiento por
# defecto; no se declara `synthetic-package` porque ya no tiene efecto).
