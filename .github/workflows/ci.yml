name: CI (análisis y pruebas)

# Gate de calidad: corre en cada Pull Request y en los push a ramas de trabajo.
# Los push a `main` los cubre el workflow de despliegue (deploy.yml).
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

# Cancela corridas obsoletas de la misma referencia.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analizar y probar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      - name: Análisis estático
        # --no-fatal-infos: no bloquea por avisos informativos preexistentes
        # (deprecaciones, `const`, dart:html del import web condicional). El
        # gate sigue fallando ante errores y warnings reales.
        run: flutter analyze --no-fatal-infos

      - name: Pruebas
        run: flutter test
