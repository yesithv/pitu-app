name: CI (análisis y pruebas)

# Gate de calidad: corre en cada Pull Request y en los push a ramas de trabajo.
# Los push a `main` los cubre el workflow de despliegue (deploy.yml).
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

# Cancela corridas obsoletas de la misma referencia.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analizar y probar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar código (Drift)
        # Drift genera `*.g.dart` (no se versionan). Debe correr antes de
        # analyze/test para que el árbol compile.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Análisis estático
        # Gate estricto: falla ante errores, warnings e infos. La deuda de lint
        # preexistente ya se saldó; los avisos inherentes (p. ej. dart:html del
        # import web condicional) se silencian de forma acotada en su archivo.
        run: flutter analyze --fatal-infos

      - name: Pruebas
        run: flutter test
