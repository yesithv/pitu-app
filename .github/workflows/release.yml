name: Release Android (AAB)

# Compila el App Bundle (.aab) de PituApp al empujar un tag `vMAYOR.MENOR.PARCHE`
# (p. ej. `v0.1.0`). El `versionCode` se inyecta de forma incremental con
# `--build-number` (número de corrida de CI), de modo que dos artefactos nunca
# comparten `versionCode` aunque el nombre de versión no cambie. Ver CHANGELOG.md
# → "Política de versionado" y docs/RELEASE_ANDROID.md.
#
# Sin `android/key.properties` (secretos de firma), el AAB cae a la firma debug:
# sirve para verificar el pipeline, pero NO es válido para publicar en Play.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-aab:
    name: Compilar App Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar código (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Restaurar binarios no versionados (gradle-wrapper.jar + iconos)
        # Igual que android.yml: restaura el wrapper .jar y los iconos PNG por
        # defecto desde un andamiaje temporal, sin tocar la configuración
        # versionada (manifiesto, build.gradle, MainActivity, etc.).
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          flutter create --platforms=android --org com.ironcoding --project-name pitu_app "$tmp"
          mkdir -p android/gradle/wrapper
          cp "$tmp/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
          for d in "$tmp"/android/app/src/main/res/mipmap-*; do
            name="$(basename "$d")"
            mkdir -p "android/app/src/main/res/$name"
            cp "$d"/* "android/app/src/main/res/$name/"
          done

      - name: Compilar App Bundle (release)
        # `versionCode` incremental via CI; `versionName` sale de pubspec.yaml.
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Subir el AAB como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
